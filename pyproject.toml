[project]
name = "tooldownload"
version = "0.1.0"
description = "Desktop TikTok video downloader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.12.6",
    "curl-cffi>=0.7.0",
    "customtkinter>=6.0.0",
    "pillow>=10.0.0",
    "mutagen>=1.47.0",
]

[project.scripts]
tiktok-downloader = "app:run"
